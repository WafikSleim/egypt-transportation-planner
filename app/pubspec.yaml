name: egypt_transport
description: >
  Trip planning for Egyptian public transport, built around the paratransit
  network — microbuses, tomnayas, minibuses — that other tools ignore.
  Non-profit: the source data is CC BY-NC 4.0, so there is no revenue model.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management. The ViewModel layer of MVVM is a Cubit — see
  # lib/features/*/view_model. Settled 2026-09-21; do not mix in a second
  # state solution.
  flutter_bloc: ^9.1.1
  bloc: ^9.0.1
  equatable: ^2.0.7

  # Responsive sizing. The design is drawn at 390x844; screenutil scales it
  # to the real device. The target is low-end Android, where screens run from
  # small 5" phones upward, so a layout pinned to raw logical pixels either
  # crowds or wastes space on most of the fleet.
  flutter_screenutil: ^5.9.3

  # HTTP. `http` rather than dio: the target is low-end Android on patchy
  # data, and the API surface is four endpoints.
  http: ^1.5.0

  # Device location. Only ever read on demand, never in the background -
  # background tracking is its own feature (#24) with its own consent.
  geolocator: ^14.0.2

  # On-device storage. shared_preferences rather than drift: see
  # lib/core/storage/key_value_store.dart for the reasoning and for what
  # would justify revisiting it.
  shared_preferences: ^2.5.3

  # Map rendering (#19). MapLibre Native rather than flutter_map: the tiles
  # are Protomaps .pmtiles, which MapLibre reads over the pmtiles:// protocol
  # on Android and iOS with no plugin and no proxy. See
  # lib/core/map/map_view.dart for the decision and what would reverse it.
  maplibre_gl: ^0.27.1

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0

  # Generators, not runtime code - they expand assets/icon/*.png into the
  # platform sets and are never shipped. Re-run them after
  # `python scripts/build_app_icon.py`:
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Captured from the live API. Used by tests, and by nothing else — the
    # app never falls back to canned data.
    - test/fixtures/

  # Bundled, not fetched at runtime via google_fonts: a first run on a weak
  # connection would otherwise fall back to a system font with no Arabic
  # shaping of the quality this app depends on.
  fonts:
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Variable.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

# Generated from assets/icon/, which is generated in turn by
# scripts/build_app_icon.py. Do not hand-edit the platform icon sets: they are
# output, and the next run overwrites them.
flutter_launcher_icons:
  android: ic_launcher
  ios: true
  image_path: assets/icon/icon.png

  # Adaptive icons are two layers. The background is the flat accent and the
  # foreground is the mark, sized to survive being masked to a circle, a
  # squircle or a rounded square - different launchers choose differently.
  adaptive_icon_background: "#4A3FA0"
  adaptive_icon_foreground: assets/icon/icon-foreground.png

  # Android 13 themed icons: the launcher recolours a monochrome layer to the
  # user's wallpaper palette. Reusing the foreground works because the mark is
  # a single solid shape with no internal colour to lose.
  adaptive_icon_monochrome: assets/icon/icon-foreground.png

  remove_alpha_ios: true

flutter_native_splash:
  # The `bg` tokens from docs/design-system.md, so the very first frame is
  # already the app's own background. A white default would flash before a
  # dark-themed app - which is the one thing a splash must not do.
  color: "#FBFAF7"
  color_dark: "#121210"
  image: assets/icon/splash.png
  image_dark: assets/icon/splash-dark.png

  android_12:
    color: "#FBFAF7"
    color_dark: "#121210"
    image: assets/icon/splash.png
    image_dark: assets/icon/splash-dark.png
    icon_background_color: "#FBFAF7"
    icon_background_color_dark: "#121210"
