org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is off on purpose.
#
# On Windows it fails the build with "Could not close incremental caches ...
# class-fq-name-to-source.tab" - a file-locking problem, not a code problem.
# It hit three plugins here (maplibre_gl, package_info_plus,
# shared_preferences_android), including one compiling for the first time with
# no cache to corrupt, so it is systematic rather than stale state. Deleting
# the caches does not fix it; this does.
#
# The cost is slower incremental Android builds. The alternative is a build
# that fails at random, which is worse - and CI does clean builds anyway.
kotlin.incremental=false
